<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레크마스터 · 문제 관리</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F7;--card:#fff;--card2:#FBFBFD;--fill:#F0F0F3;--fill2:#E8E8ED;--fill3:#DEDEE3;
  --blue:#0071E3;--blueH:#0077ED;--blueSoft:#E8F1FD;--purple:#6C5CE7;
  --grad:linear-gradient(135deg,#0071E3,#42A5F5 55%,#5AC8FA);
  --green:#34C759;--orange:#FF9500;--red:#FF3B30;--violet:#AF52DE;--yellow:#FFCC00;
  --txt:#1D1D1F;--txt2:#6E6E73;--txt3:#8E8E93;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.05);
  --font:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  --sh-sm:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.05);
  --sh:0 4px 16px rgba(0,0,0,.06);--sh-lg:0 16px 48px rgba(0,0,0,.13);
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14.5px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select,textarea{font-family:var(--font)}
button{cursor:pointer;border:none;color:inherit;background:none}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.14);border-radius:11px;border:3px solid transparent;background-clip:content-box}
h1,h2,h3{letter-spacing:-.025em;font-weight:700}
.wrap{max-width:1280px;margin:0 auto;padding:26px 26px 70px}

.phead{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.phead h1{font-size:25px}
.phead .ps{font-size:13.5px;color:var(--txt2);margin-top:5px}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:980px;font-weight:600;font-size:13.5px;transition:.17s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-pri{background:var(--blue);color:#fff}.btn-pri:hover{background:var(--blueH)}
.btn-grad{background:var(--grad);color:#fff;box-shadow:0 5px 16px rgba(0,113,227,.28)}
.btn-sec{background:var(--fill);color:var(--txt)}.btn-sec:hover{background:var(--fill2)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}.btn-ghost:hover{background:var(--fill)}
.btn-sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* 품질 요약 */
.qs{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:18px}
.q{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--sh-sm);transition:.18s;cursor:pointer;border:2px solid transparent}
.q:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.q.on{border-color:var(--blue)}
.q .n{font-size:25px;font-weight:700;letter-spacing:-.03em}
.q .l{font-size:12.5px;color:var(--txt2);margin-top:3px}
.q.b .n{color:var(--blue)}.q.r .n{color:var(--red)}.q.o .n{color:var(--orange)}.q.v .n{color:var(--violet)}.q.g .n{color:var(--green)}

/* 빠른 추가 */
.qadd{background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--sh-sm);margin-bottom:14px;border:1.5px solid var(--blueSoft)}
.qadd .lb{font-size:12.5px;font-weight:600;color:var(--blue);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.qadd .lb .kbd{margin-left:auto;font-size:11px;color:var(--txt3);font-weight:400}
.qrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qrow select,.qrow input{background:var(--fill);border:1px solid transparent;border-radius:10px;padding:9px 12px;font-size:13.5px;color:var(--txt);outline:none;transition:.15s}
.qrow input:focus,.qrow select:focus{background:var(--card);border-color:var(--blue);box-shadow:0 0 0 3.5px var(--blueSoft)}
.qrow .g{width:180px}.qrow .c{width:120px}.qrow .qq{flex:1;min-width:170px}.qrow .aa{width:170px}

/* 툴바 */
.tools{background:var(--card);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh-sm);margin-bottom:13px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.srch{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:8px 12px}
.srch input{border:none;background:none;outline:none;font-size:13.5px;width:100%;color:var(--txt)}
select.sel{background:var(--fill);border:none;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:500;cursor:pointer;color:var(--txt);max-width:190px}
.bulk{background:var(--blueSoft);border-radius:var(--r);padding:11px 15px;margin-bottom:12px;display:none;align-items:center;gap:10px;font-size:13.5px;color:var(--blue);font-weight:600;flex-wrap:wrap}
.bulk.on{display:flex}
.bulk select{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--txt)}

/* 테이블 */
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm)}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--txt2);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card2)}
.tbl th.s{cursor:pointer;user-select:none}.tbl th.s:hover{color:var(--txt)}
.tbl th .ar{opacity:.35;font-size:9px;margin-left:3px}.tbl th.ac .ar{opacity:1;color:var(--blue)}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:.1s}.tbl tbody tr:hover{background:var(--card2)}
.tbl tbody tr.sel{background:var(--blueSoft)}
.tbl tbody tr.dup{background:#FFF9E8}
.tbl tbody tr.err{background:#FFF3F2}
.ck{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--fill3);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.14s;font-size:11px;color:#fff}
.ck.on{background:var(--blue);border-color:var(--blue)}
/* 인라인 편집 */
.ce{width:100%;background:transparent;border:1.5px solid transparent;border-radius:8px;padding:7px 9px;font-size:13.5px;color:var(--txt);outline:none;transition:.14s}
.ce:hover{background:var(--fill)}
.ce:focus{background:var(--card);border-color:var(--blue);box-shadow:0 0 0 3px var(--blueSoft)}
.ce.ans{font-weight:600;color:var(--blue)}
.ce.ans.empty{color:var(--red)}
.ce.ans.empty::placeholder{color:var(--red);opacity:.7}
.ce.cat{font-size:12px;color:var(--violet);font-weight:600}
.gsel{background:transparent;border:1.5px solid transparent;border-radius:8px;padding:6px 7px;font-size:12.5px;color:var(--txt2);outline:none;max-width:160px;cursor:pointer;transition:.14s}
.gsel:hover{background:var(--fill)}
.gsel:focus{background:var(--card);border-color:var(--blue)}
.badge{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:980px;white-space:nowrap}
.b-dup{background:#FFF6E0;color:#B8860B}.b-err{background:#FFEBE9;color:#D70015}.b-ok{background:#E4F8EA;color:#248A3D}
.ib{width:28px;height:28px;border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center;font-size:12.5px;transition:.14s;opacity:.45}
tr:hover .ib{opacity:1}
.ib:hover{background:#FFEBE9;color:var(--red)}
.empty{text-align:center;padding:54px;color:var(--txt2);font-size:13.5px;line-height:1.7;background:var(--card);border-radius:var(--r);box-shadow:var(--sh-sm)}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;flex-wrap:wrap}
.pg{min-width:31px;height:31px;border-radius:9px;background:var(--card);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm);padding:0 9px}
.pg.on{background:var(--blue);color:#fff}.pg:disabled{opacity:.35}
.cnt{font-size:13px;color:var(--txt2);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cnt b{color:var(--blue)}
.cnt .sv{margin-left:auto;font-size:12px;color:var(--green);opacity:0;transition:.3s}
.cnt .sv.on{opacity:1}

/* 카테고리 패널 */
.cats{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh-sm);margin-bottom:14px}
.cats h3{font-size:15px;margin-bottom:13px;display:flex;align-items:center;gap:8px}
.cats h3 .hint{margin-left:auto;font-size:12px;color:var(--txt3);font-weight:400}
.cchips{display:flex;gap:7px;flex-wrap:wrap}
.cchip{padding:7px 13px;border-radius:980px;background:var(--fill);font-size:12.5px;font-weight:500;transition:.15s;display:flex;align-items:center;gap:6px}
.cchip:hover{background:var(--fill2)}
.cchip.on{background:var(--violet);color:#fff}
.cchip b{opacity:.65;font-weight:600}
.cchip.on b{opacity:.85}

/* modal */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:20px}
.mbg.on{display:flex}
.mdl{background:var(--card);border-radius:22px;padding:24px;max-width:520px;width:100%;box-shadow:var(--sh-lg);max-height:86vh;overflow-y:auto}
.mdl h3{font-size:18.5px;margin-bottom:8px}
.mdl p{font-size:13.5px;color:var(--txt2);margin-bottom:16px;line-height:1.6}
.dupg{background:var(--fill);border-radius:12px;padding:13px;margin-bottom:10px}
.dupg .dq{font-size:14px;font-weight:600;margin-bottom:8px}
.dupr{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;color:var(--txt2);border-top:1px solid var(--line2)}
.dupr:first-of-type{border-top:none}
.ta{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace;min-height:150px;resize:vertical;outline:none;line-height:1.6}
.ta:focus{border-color:var(--blue);box-shadow:0 0 0 3.5px var(--blueSoft)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,30,32,.93);backdrop-filter:blur(20px);color:#fff;padding:12px 22px;border-radius:980px;font-size:13.5px;font-weight:500;opacity:0;transition:.34s cubic-bezier(.16,1,.3,1);z-index:200;box-shadow:var(--sh-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1000px){.qs{grid-template-columns:repeat(3,1fr)}.qrow .g,.qrow .c,.qrow .aa{width:100%}.hs{display:none}}
@media(max-width:700px){.wrap{padding:18px 14px 60px}.qs{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="phead">
    <div><h1>📝 문제 관리</h1><div class="ps">모든 게임의 문제를 한곳에서 편집·점검하세요. 표에서 바로 수정됩니다</div></div>
    <div class="acts">
      <button class="btn btn-ghost" onclick="openDup()">🔍 중복 검사</button>
      <button class="btn btn-ghost" onclick="openBulkAdd()">📥 대량 추가</button>
      <button class="btn btn-ghost" onclick="exportCSV()">📤 CSV</button>
      <button class="btn btn-grad" onclick="exportJSON()">💾 JSON 내보내기</button>
    </div>
  </div>

  <div class="qs">
    <div class="q b" onclick="setIssue('')"><div class="n" id="k1">0</div><div class="l">전체 문제</div></div>
    <div class="q r" onclick="setIssue('noans')"><div class="n" id="k2">0</div><div class="l">정답 누락</div></div>
    <div class="q o" onclick="setIssue('dup')"><div class="n" id="k3">0</div><div class="l">중복 항목</div></div>
    <div class="q v" onclick="setIssue('nocat')"><div class="n" id="k4">0</div><div class="l">분류 없음</div></div>
    <div class="q g" onclick="setIssue('')"><div class="n" id="k5">0</div><div class="l">카테고리 수</div></div>
  </div>

  <div class="qadd">
    <div class="lb">⚡ 빠른 추가 <span class="kbd">Enter로 연속 추가 · 입력 후 바로 다음 문제</span></div>
    <div class="qrow">
      <select class="g" id="aGame" onchange="onAddGameChange()"></select>
      <input class="c" id="aCat" placeholder="분류 (선택)" onkeydown="if(event.key==='Enter')quickAdd()">
      <input class="qq" id="aQ" placeholder="문제 또는 항목" onkeydown="if(event.key==='Enter')quickAdd()">
      <input class="aa" id="aA" placeholder="정답" onkeydown="if(event.key==='Enter')quickAdd()">
      <button class="btn btn-pri" onclick="quickAdd()">＋ 추가</button>
    </div>
  </div>

  <div class="cats"><h3>🏷️ 카테고리 <span class="hint">클릭해서 필터 · 대괄호로 시작하는 접두어를 자동 인식합니다</span></h3><div class="cchips" id="cchips"></div></div>

  <div class="tools">
    <div class="srch"><span>🔍</span><input id="q" placeholder="문제·정답 검색" oninput="page=1;render()"></div>
    <select class="sel" id="fG" onchange="page=1;render()"><option value="">전체 게임</option></select>
    <select class="sel" id="fI" onchange="page=1;render()">
      <option value="">전체 상태</option><option value="noans">정답 누락</option><option value="dup">중복</option><option value="nocat">분류 없음</option></select>
    <select class="sel" id="per" onchange="PER=+this.value;page=1;render()">
      <option value="25">25개씩</option><option value="50" selected>50개씩</option><option value="100">100개씩</option></select>
  </div>

  <div class="bulk" id="bulk"><span id="bn">0개 선택됨</span>
    <select id="mvGame"><option value="">다른 게임으로 이동…</option></select>
    <button class="btn btn-sm btn-sec" onclick="bulkMove()">이동</button>
    <input id="mvCat" placeholder="분류 일괄 변경" style="background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.5px;outline:none;width:130px">
    <button class="btn btn-sm btn-sec" onclick="bulkCat()">적용</button>
    <button class="btn btn-sm btn-sec" style="color:var(--red);margin-left:auto" onclick="bulkDel()">선택 삭제</button>
    <button class="btn btn-sm btn-ghost" onclick="clearSel()">해제</button>
  </div>

  <div class="cnt" id="cnt"></div>
  <div id="tbl"></div>
  <div class="pager" id="pager"></div>
</div>
<div class="mbg" id="mbg" onclick="if(event.target.id==='mbg')closeM()"><div class="mdl" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const ARCH={QUIZ:{ko:'퀴즈형',ic:'🧠',qa:1},TALK:{ko:'토크형',ic:'💬'},SURVIVAL:{ko:'서바이벌형',ic:'⚡'},PERFORM:{ko:'퍼포먼스형',ic:'🎭'},PICK:{ko:'룰렛/추첨형',ic:'🎰'},BOMB:{ko:'폭탄/긴장형',ic:'💣'}};
const SEED=[
 {k:'choseong',name:'카테고리 초성 퀴즈',arch:'QUIZ',pool:[{q:'[음식] ㄸㅂㅇ',a:'떡볶이'},{q:'[음식] ㅁㄹㅌ',a:'마라탕'},{q:'[음식] ㅂㄷㅉㄱ',a:'부대찌개'},{q:'[동물] ㅋㅍㄹ',a:'카피바라'},{q:'[동물] ㄹㅅㅍㄷ',a:'레서판다'},{q:'[동물] ㄱㅇㄹㄱ',a:'개미핥기'},{q:'[장소] ㅎㅇㄷ',a:'해운대'},{q:'[장소] ㅅㅅㅇㅊㅂ',a:'성산일출봉'},{q:'[유행어] ㅇㅈㄸ',a:'알잘딱'},{q:'[유행어] ㄱㅇㅊ',a:''},{q:'[영화] ㄱㅁㅊ',a:'기생충'},{q:'[여름] ㅅㅂ',a:'수박'},{q:'[음식] ㄸㅂㅇ',a:'떡볶이'},{q:'ㅊㅋ',a:'치킨'}]},
 {k:'inmul',name:'인물 퀴즈',arch:'QUIZ',pool:[{q:'[역사] 조선 4대 왕 / 만원권 / 한글 창제',a:'세종대왕'},{q:'[역사] 조선 장군 / 거북선 / 백원 동전',a:'이순신'},{q:'[캐릭터] 파란 펭귄 / 헬멧 / 노는 게 제일 좋아',a:'뽀로로'},{q:'[캐릭터] 노란 캐릭터 / 볼 빨간 / 전기',a:'피카츄'},{q:'[인물] 물리학자 / 혀 내민 사진 / E=mc²',a:'아인슈타인'},{q:'[캐릭터] 빨간 옷 / 순록 썰매 / 12월',a:''}]},
 {k:'balance',name:'밸런스 게임',arch:'TALK',pool:['[음식] 평생 치킨만 vs 평생 피자만','[음식] 부먹 vs 찍먹','[음식] 민초 좋아 vs 민초 싫어','[여행] 산 vs 바다','[성향] 계획파 vs 즉흥파','[대학] 1교시 전공 vs 6교시 교양','[인생] 돈 많고 시간 없음 vs 시간 많고 돈 없음','[대학] 새터 밤샘 vs 일찍 자기','[성향] 강아지상 vs 고양이상','[인생] 유명해지기 vs 부자되기','[음식] 부먹 vs 찍먹']},
 {k:'manyak',name:'만약에',arch:'TALK',pool:['하루 동안 투명인간이 된다면?','10억이 생기면 제일 먼저?','초능력 하나를 고른다면?','무인도에 3개만 가져간다면?','과거로 딱 하루 돌아간다면?']},
 {k:'mommal',name:'몸으로 말해요',arch:'PERFORM',pool:['[동작] 기타치기','[동작] 수영','[동작] 볼링','[동작] 태권도','[운동] 낚시','[일상] 셀카찍기','[운동] 줄넘기','[캐릭터] 좀비걷기','[동작] 로봇춤','[캐릭터] 펭귄걸음']},
 {k:'roulette',name:'벌칙 룰렛',arch:'PICK',pool:['[순한맛] 애교 3종 세트','[순한맛] 성대모사 하나','[순한맛] 옆사람 칭찬 10초','[중간] 유행어 외치기','[중간] 웃긴 표정 5초']},
];
let GAMES=[],PER=50,page=1,sortK='',sortA=true,sel=new Set(),catF='',issueF='';

function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1500)}
function modal(h){document.getElementById('mbox').innerHTML=h;document.getElementById('mbg').classList.add('on')}
function closeM(){document.getElementById('mbg').classList.remove('on')}
function load(){try{const s=localStorage.getItem('rm_items');GAMES=s?JSON.parse(s):JSON.parse(JSON.stringify(SEED))}catch(e){GAMES=JSON.parse(JSON.stringify(SEED))}}
function save(){try{localStorage.setItem('rm_items',JSON.stringify(GAMES))}catch(e){}
 const s=document.querySelector('#cnt .sv');if(s){s.classList.add('on');clearTimeout(s._t);s._t=setTimeout(()=>s.classList.remove('on'),1400)}}

/* 카테고리 파싱: "[음식] ㄸㅂㅇ" → {cat:'음식', body:'ㄸㅂㅇ'} */
function parseCat(s){const m=String(s||'').match(/^\s*\[([^\]]{1,14})\]\s*(.*)$/);return m?{cat:m[1].trim(),body:m[2].trim()}:{cat:'',body:String(s||'').trim()}}
function joinCat(cat,body){return cat&&cat.trim()?`[${cat.trim()}] ${body}`:body}
function norm(s){return String(s||'').toLowerCase().replace(/[\s·,.!?~\-—]/g,'')}

/* 평탄화 */
function rows(){
 const out=[];
 GAMES.forEach((g,gi)=>(g.pool||[]).forEach((p,pi)=>{
  const isQA=typeof p==='object';const raw=isQA?(p.q||''):p;
  const {cat,body}=parseCat(raw);
  if(!body.trim()&&!(isQA&&p.a))return;
  out.push({gi,pi,g,isQA,cat,body,a:isQA?(p.a||''):''})}));
 // 중복 그룹 (전체 범위, 정규화 비교)
 const cnt={};out.forEach(r=>{const k=norm(r.body);cnt[k]=(cnt[k]||0)+1});
 out.forEach(r=>r.dup=cnt[norm(r.body)]>1);
 return out}
function allCats(){const c={};rows().forEach(r=>{if(r.cat)c[r.cat]=(c[r.cat]||0)+1});return c}

function filtered(){
 const q=(document.getElementById('q').value||'').trim(),fg=document.getElementById('fG').value;
 const fi=issueF||document.getElementById('fI').value;
 let l=rows();
 if(fg)l=l.filter(r=>r.g.k===fg);
 if(catF)l=l.filter(r=>r.cat===catF);
 if(q){const nq=norm(q);l=l.filter(r=>norm(r.body).includes(nq)||norm(r.a).includes(nq)||r.cat.includes(q))}
 if(fi==='noans')l=l.filter(r=>r.isQA&&!r.a.trim());
 if(fi==='dup')l=l.filter(r=>r.dup);
 if(fi==='nocat')l=l.filter(r=>!r.cat);
 if(sortK==='cat')l.sort((a,b)=>sortA?a.cat.localeCompare(b.cat):b.cat.localeCompare(a.cat));
 else if(sortK==='body')l.sort((a,b)=>sortA?a.body.localeCompare(b.body):b.body.localeCompare(a.body));
 else if(sortK==='game')l.sort((a,b)=>sortA?a.g.name.localeCompare(b.g.name):b.g.name.localeCompare(a.g.name));
 return l}

function render(){
 const all=rows();
 document.getElementById('k1').textContent=all.length;
 document.getElementById('k2').textContent=all.filter(r=>r.isQA&&!r.a.trim()).length;
 document.getElementById('k3').textContent=all.filter(r=>r.dup).length;
 document.getElementById('k4').textContent=all.filter(r=>!r.cat).length;
 const cats=allCats();document.getElementById('k5').textContent=Object.keys(cats).length;
 document.getElementById('cchips').innerHTML=`<button class="cchip ${!catF?'on':''}" onclick="catF='';page=1;render()">전체 <b>${all.length}</b></button>`+
  Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<button class="cchip ${catF===c?'on':''}" onclick="catF='${esc(c)}';page=1;render()">${esc(c)} <b>${n}</b></button>`).join('')+
  (all.filter(r=>!r.cat).length?`<button class="cchip ${catF==='__none'?'on':''}" onclick="setIssue('nocat')" style="opacity:.7">분류 없음 <b>${all.filter(r=>!r.cat).length}</b></button>`:'');

 const l=filtered(),tp=Math.max(1,Math.ceil(l.length/PER));if(page>tp)page=tp;
 const pl=l.slice((page-1)*PER,page*PER);
 const gOpts=GAMES.map((g,i)=>`<option value="${i}">${esc(g.name)}</option>`).join('');
 const ar=k=>sortK===k?(sortA?'▲':'▼'):'▲',cl=k=>sortK===k?'s ac':'s';
 document.getElementById('cnt').innerHTML=`총 <b>${l.length}개</b> 표시 ${catF?`· 분류 <b>${esc(catF)}</b>`:''}<span class="sv">✓ 저장됨</span>`;
 const w=document.getElementById('tbl');
 if(!l.length){w.innerHTML=`<div class="empty">조건에 맞는 문제가 없어요.<br>필터를 바꾸거나 위에서 새 문제를 추가하세요.</div>`;document.getElementById('pager').innerHTML='';updBulk();return}
 w.innerHTML=`<table class="tbl"><thead><tr>
  <th style="width:34px"><span class="ck ${pl.length&&pl.every(r=>sel.has(r.gi+':'+r.pi))?'on':''}" onclick="togAll()">✓</span></th>
  <th style="width:44px">#</th>
  <th class="${cl('cat')}" style="width:120px" onclick="sortBy('cat')">분류<span class="ar">${ar('cat')}</span></th>
  <th class="${cl('body')}" onclick="sortBy('body')">문제 · 항목<span class="ar">${ar('body')}</span></th>
  <th style="width:190px">정답</th>
  <th class="${cl('game')} hs" style="width:175px" onclick="sortBy('game')">소속 게임<span class="ar">${ar('game')}</span></th>
  <th style="width:80px">상태</th><th style="width:40px"></th></tr></thead><tbody>
 ${pl.map((r,i)=>{const id=r.gi+':'+r.pi,s=sel.has(id),bad=r.isQA&&!r.a.trim();
  return `<tr class="${s?'sel':bad?'err':r.dup?'dup':''}">
   <td><span class="ck ${s?'on':''}" onclick="togSel('${id}')">✓</span></td>
   <td style="color:var(--txt3);font-size:12px">${(page-1)*PER+i+1}</td>
   <td><input class="ce cat" value="${esc(r.cat)}" placeholder="–" onchange="upCat(${r.gi},${r.pi},this.value)"></td>
   <td><input class="ce" value="${esc(r.body)}" onchange="upBody(${r.gi},${r.pi},this.value)"></td>
   <td>${r.isQA?`<input class="ce ans ${bad?'empty':''}" value="${esc(r.a)}" placeholder="${bad?'정답 필요':''}" onchange="upAns(${r.gi},${r.pi},this.value)">`:`<span style="color:var(--txt3);font-size:12.5px;padding-left:9px">정답 없는 유형</span>`}</td>
   <td class="hs"><select class="gsel" onchange="mvOne(${r.gi},${r.pi},this.value)">${GAMES.map((g,gi)=>`<option value="${gi}" ${gi===r.gi?'selected':''}>${ARCH[g.arch].ic} ${esc(g.name)}</option>`).join('')}</select></td>
   <td>${bad?'<span class="badge b-err">정답 누락</span>':r.dup?'<span class="badge b-dup">중복</span>':'<span class="badge b-ok">정상</span>'}</td>
   <td><button class="ib" onclick="delOne(${r.gi},${r.pi})">🗑</button></td></tr>`}).join('')}
 </tbody></table>`;
 let pg=`<button class="pg" ${page===1?'disabled':''} onclick="page--;render()">‹</button>`;
 const s=Math.max(1,page-2),e=Math.min(tp,s+4);
 if(s>1)pg+=`<button class="pg" onclick="page=1;render()">1</button>${s>2?'<span style="color:var(--txt3)">…</span>':''}`;
 for(let i=s;i<=e;i++)pg+=`<button class="pg ${i===page?'on':''}" onclick="page=${i};render()">${i}</button>`;
 if(e<tp)pg+=`${e<tp-1?'<span style="color:var(--txt3)">…</span>':''}<button class="pg" onclick="page=${tp};render()">${tp}</button>`;
 pg+=`<button class="pg" ${page===tp?'disabled':''} onclick="page++;render()">›</button>`;
 document.getElementById('pager').innerHTML=tp>1?pg:'';
 document.getElementById('mvGame').innerHTML='<option value="">다른 게임으로 이동…</option>'+gOpts;
 updBulk()}

function sortBy(k){if(sortK===k)sortA=!sortA;else{sortK=k;sortA=true}render()}
function setIssue(v){issueF=v;document.getElementById('fI').value=v;catF='';page=1;
 document.querySelectorAll('.q').forEach(q=>q.classList.remove('on'));render()}

/* 인라인 편집 */
function itemAt(gi,pi){return GAMES[gi].pool[pi]}
function upCat(gi,pi,v){const p=itemAt(gi,pi);const isQA=typeof p==='object';
 const cur=parseCat(isQA?p.q:p);const nv=joinCat(v,cur.body);
 if(isQA)p.q=nv;else GAMES[gi].pool[pi]=nv;save();render()}
function upBody(gi,pi,v){const p=itemAt(gi,pi);const isQA=typeof p==='object';
 const cur=parseCat(isQA?p.q:p);const nv=joinCat(cur.cat,v);
 if(isQA)p.q=nv;else GAMES[gi].pool[pi]=nv;save();render()}
function upAns(gi,pi,v){const p=itemAt(gi,pi);if(typeof p==='object'){p.a=v;save();render()}}
function delOne(gi,pi){GAMES[gi].pool.splice(pi,1);sel.clear();save();render();toast('삭제했어요')}
function mvOne(gi,pi,toStr){const to=+toStr;if(to===gi)return;
 const src=GAMES[gi],dst=GAMES[to],p=src.pool[pi];
 const sQA=ARCH[src.arch].qa,dQA=ARCH[dst.arch].qa;
 let np=p;
 if(sQA&&!dQA)np=typeof p==='object'?p.q:p;
 else if(!sQA&&dQA)np={q:typeof p==='string'?p:p.q,a:''};
 dst.pool.push(np);src.pool.splice(pi,1);sel.clear();save();render();toast(`"${dst.name}"으로 옮겼어요`)}

/* 선택 */
function togSel(id){sel.has(id)?sel.delete(id):sel.add(id);render()}
function togAll(){const pl=filtered().slice((page-1)*PER,page*PER).map(r=>r.gi+':'+r.pi);
 const all=pl.every(i=>sel.has(i));pl.forEach(i=>all?sel.delete(i):sel.add(i));render()}
function clearSel(){sel.clear();render()}
function updBulk(){const b=document.getElementById('bulk');b.classList.toggle('on',sel.size>0);document.getElementById('bn').textContent=sel.size+'개 선택됨'}
function selList(){return [...sel].map(s=>{const[a,b]=s.split(':');return{gi:+a,pi:+b}}).sort((x,y)=>y.gi-x.gi||y.pi-x.pi)}
function bulkDel(){const n=sel.size;
 modal(`<h3>문제 삭제</h3><p>선택한 <b>${n}개</b> 문제를 삭제할까요? 되돌릴 수 없어요.</p><div style="display:flex;gap:10px"><button class="btn btn-sec" style="flex:1;justify-content:center;padding:12px" onclick="closeM()">취소</button><button class="btn" style="flex:1;justify-content:center;padding:12px;background:var(--red);color:#fff" onclick="doBulkDel()">삭제</button></div>`)}
function doBulkDel(){selList().forEach(({gi,pi})=>GAMES[gi].pool.splice(pi,1));sel.clear();save();closeM();render();toast('삭제했어요')}
function bulkMove(){const to=document.getElementById('mvGame').value;if(to===''){toast('이동할 게임을 선택하세요');return}
 const t=+to,dst=GAMES[t],dQA=ARCH[dst.arch].qa;
 selList().forEach(({gi,pi})=>{if(gi===t)return;const src=GAMES[gi],p=src.pool[pi],sQA=ARCH[src.arch].qa;
  let np=p;if(sQA&&!dQA)np=typeof p==='object'?p.q:p;else if(!sQA&&dQA)np={q:typeof p==='string'?p:p.q,a:''};
  dst.pool.push(np);src.pool.splice(pi,1)});
 sel.clear();save();render();toast(`"${dst.name}"으로 옮겼어요`)}
function bulkCat(){const c=document.getElementById('mvCat').value.trim();
 selList().forEach(({gi,pi})=>{const p=GAMES[gi].pool[pi],isQA=typeof p==='object';
  const cur=parseCat(isQA?p.q:p);const nv=joinCat(c,cur.body);if(isQA)p.q=nv;else GAMES[gi].pool[pi]=nv});
 sel.clear();save();render();toast(c?`분류를 "${c}"로 바꿨어요`:'분류를 지웠어요')}

/* 빠른 추가 */
function onAddGameChange(){const gi=+document.getElementById('aGame').value;const qa=ARCH[GAMES[gi].arch].qa;
 document.getElementById('aA').style.display=qa?'':'none'}
function quickAdd(){
 const gi=+document.getElementById('aGame').value;
 const cat=document.getElementById('aCat').value.trim();
 const q=document.getElementById('aQ').value.trim();
 const a=document.getElementById('aA').value.trim();
 if(!q){document.getElementById('aQ').focus();toast('문제를 입력하세요');return}
 const g=GAMES[gi],qa=ARCH[g.arch].qa;
 g.pool.push(qa?{q:joinCat(cat,q),a}:joinCat(cat,q));
 document.getElementById('aQ').value='';document.getElementById('aA').value='';
 document.getElementById('aQ').focus();save();render();toast('추가했어요')}

/* 중복 검사 */
function openDup(){
 const all=rows(),grp={};
 all.forEach(r=>{const k=norm(r.body);if(!grp[k])grp[k]=[];grp[k].push(r)});
 const dups=Object.values(grp).filter(v=>v.length>1);
 if(!dups.length){modal(`<h3>🔍 중복 검사</h3><p>중복된 문제가 없어요. 깨끗합니다 ✨</p><button class="btn btn-sec" style="width:100%;justify-content:center;padding:12px" onclick="closeM()">닫기</button>`);return}
 modal(`<h3>🔍 중복 검사</h3><p>공백·기호를 무시하고 비교했어요. <b>${dups.length}개 그룹 · 총 ${dups.reduce((s,v)=>s+v.length,0)}개</b> 항목이 겹칩니다.</p>
 ${dups.slice(0,20).map(v=>`<div class="dupg"><div class="dq">${esc(v[0].body)}</div>
  ${v.map(r=>`<div class="dupr"><span style="flex:1">${ARCH[r.g.arch].ic} ${esc(r.g.name)}${r.cat?` · <b style="color:var(--violet)">${esc(r.cat)}</b>`:''}${r.a?` → ${esc(r.a)}`:''}</span></div>`).join('')}
  <button class="btn btn-sm btn-sec" style="margin-top:9px;color:var(--red)" onclick='dedupe(${JSON.stringify(norm(v[0].body))})'>첫 항목만 남기고 정리</button></div>`).join('')}
 ${dups.length>20?`<p style="text-align:center;color:var(--txt3)">외 ${dups.length-20}개 그룹 더…</p>`:''}
 <div style="display:flex;gap:10px;margin-top:6px"><button class="btn btn-sec" style="flex:1;justify-content:center;padding:12px" onclick="closeM()">닫기</button><button class="btn btn-pri" style="flex:1;justify-content:center;padding:12px" onclick="dedupeAll()">전부 정리</button></div>`)}
function dedupe(key){
 const all=rows().filter(r=>norm(r.body)===key);
 all.slice(1).sort((a,b)=>b.gi-a.gi||b.pi-a.pi).forEach(r=>GAMES[r.gi].pool.splice(r.pi,1));
 sel.clear();save();render();openDup();toast('중복을 정리했어요')}
function dedupeAll(){
 const seen=new Set(),rm=[];
 rows().forEach(r=>{const k=norm(r.body);if(seen.has(k))rm.push(r);else seen.add(k)});
 rm.sort((a,b)=>b.gi-a.gi||b.pi-a.pi).forEach(r=>GAMES[r.gi].pool.splice(r.pi,1));
 sel.clear();save();closeM();render();toast(`중복 ${rm.length}개를 정리했어요`)}

/* 대량 추가 */
function openBulkAdd(){
 modal(`<h3>📥 대량 추가</h3><p>한 줄에 하나씩 붙여넣으세요. <b>[분류]</b>는 자동 인식되고, 정답은 <b>탭이나 쉼표</b>로 구분합니다.</p>
 <div style="margin-bottom:12px"><select id="baGame" style="width:100%;background:var(--fill);border:none;border-radius:10px;padding:10px 12px;font-size:13.5px;outline:none">${GAMES.map((g,i)=>`<option value="${i}">${ARCH[g.arch].ic} ${esc(g.name)}</option>`).join('')}</select></div>
 <textarea class="ta" id="baTa" placeholder="[음식] ㄸㅂㅇ, 떡볶이&#10;[동물] ㅋㅍㄹ, 카피바라&#10;[장소] ㅎㅇㄷ, 해운대" oninput="baPreview()"></textarea>
 <div id="baPv" style="font-size:12.5px;color:var(--txt2);margin-top:9px"></div>
 <div style="display:flex;gap:10px;margin-top:14px"><button class="btn btn-sec" style="flex:1;justify-content:center;padding:12px" onclick="closeM()">취소</button><button class="btn btn-pri" style="flex:1;justify-content:center;padding:12px" onclick="doBulkAdd()">추가</button></div>`)}
function baParse(){
 const gi=+document.getElementById('baGame').value,qa=ARCH[GAMES[gi].arch].qa;
 return document.getElementById('baTa').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
  if(qa){const ps=l.split(/\t|,(?=[^,]*$)/);if(ps.length>=2)return{q:ps.slice(0,-1).join(',').trim(),a:ps[ps.length-1].trim()};return{q:l,a:''}}
  return l})}
function baPreview(){const items=baParse();
 document.getElementById('baPv').innerHTML=items.length?`총 <b style="color:var(--blue)">${items.length}개</b> 인식 · 정답 누락 ${items.filter(i=>typeof i==='object'&&!i.a).length}개`:''}
function doBulkAdd(){const gi=+document.getElementById('baGame').value,items=baParse();
 if(!items.length){toast('내용이 없어요');return}
 GAMES[gi].pool.push(...items);save();closeM();render();toast(`${items.length}개를 추가했어요`)}

/* 내보내기 */
function dl(s,name,type){const b=new Blob([s],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function exportJSON(){dl(JSON.stringify(GAMES,null,2),'recmaster-games.json','application/json');toast('JSON을 내보냈어요')}
function exportCSV(){
 const l=filtered();
 const csv=['게임,분류,문제,정답'].concat(l.map(r=>[r.g.name,r.cat,r.body,r.a].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))).join('\n');
 dl('\ufeff'+csv,'recmaster-items.csv','text/csv;charset=utf-8');toast(`${l.length}개를 CSV로 내보냈어요`)}

/* init */
load();
document.getElementById('fG').innerHTML='<option value="">전체 게임</option>'+GAMES.map(g=>`<option value="${g.k}">${ARCH[g.arch].ic} ${esc(g.name)}</option>`).join('');
document.getElementById('aGame').innerHTML=GAMES.map((g,i)=>`<option value="${i}">${ARCH[g.arch].ic} ${esc(g.name)}</option>`).join('');
onAddGameChange();render();
</script>
</body>
</html>
